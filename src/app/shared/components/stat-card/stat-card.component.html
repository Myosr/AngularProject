<div class="stat-card" [class.loading]="loading">

    <!-- Loading skeleton -->
    <ng-container *ngIf="loading">
        <div class="skeleton-icon"></div>
        <div class="skeleton-body">
            <div class="skeleton-line short"></div>
            <div class="skeleton-line tall"></div>
        </div>
    </ng-container>

    <!-- Content -->
    <ng-container *ngIf="!loading">
        <div class="stat-icon" [style.background]="color + '18'" [style.color]="color">
            <span class="material-icons-round">{{ icon }}</span>
        </div>

        <div class="stat-body">
            <p class="stat-title">{{ title }}</p>
            <p class="stat-value">{{ value }}</p>

            <div *ngIf="trend" class="stat-trend" [class.up]="trend === 'up'" [class.down]="trend === 'down'">
                <span class="material-icons-round trend-icon">
                    {{ trend === 'up' ? 'trending_up' : 'trending_down' }}
                </span>
                <span class="trend-text">{{ trendValue }}</span>
            </div>
        </div>
    </ng-container>

</div>
