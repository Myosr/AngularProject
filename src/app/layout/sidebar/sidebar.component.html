<!-- Mobile backdrop -->
<div class="sidebar-backdrop" *ngIf="mobileOpen" (click)="onBackdropClick()"></div>

<aside class="sidebar" [class.collapsed]="collapsed" [class.mobile-open]="mobileOpen" role="navigation"
    aria-label="Main navigation">

    <!-- Brand / Toggle row -->
    <div class="sidebar-brand">
        <button class="toggle-btn" (click)="onToggle()"
            [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
            [title]="collapsed ? 'Expand' : 'Collapse'">
            <span class="material-icons-round">
                {{ collapsed ? 'menu' : 'menu_open' }}
            </span>
        </button>

        <div class="brand-logo" *ngIf="!collapsed">
            <span class="material-icons-round brand-icon">bar_chart</span>
            <span class="brand-text">SalesDW</span>
        </div>
    </div>

    <!-- Role badge -->
    <div class="role-badge" *ngIf="!collapsed">
        <span class="material-icons-round role-icon">
            {{ auth.isAdmin() ? 'admin_panel_settings' : 'person' }}
        </span>
        <span class="role-label">{{ auth.isAdmin() ? 'Administrator' : 'User' }}</span>
    </div>

    <!-- Navigation menu -->
    <nav class="nav-menu">
        <ul>
            <li *ngFor="let item of menu">
                <a class="nav-item" [routerLink]="item.route" [class.active]="isActive(item.route)"
                    [title]="collapsed ? item.label : ''" (click)="mobileOpen && onBackdropClick()">
                    <span class="nav-icon material-icons-round">{{ item.icon }}</span>
                    <span class="nav-label" *ngIf="!collapsed">{{ item.label }}</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- Logout at bottom -->
    <div class="sidebar-footer">
        <button class="nav-item logout-btn" (click)="auth.logout().subscribe()">
            <span class="nav-icon material-icons-round">logout</span>
            <span class="nav-label" *ngIf="!collapsed">Logout</span>
        </button>
    </div>

</aside>
